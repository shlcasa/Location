name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GeoInt-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoInt-apk
          path: GeoInt-${{ github.run_number }}.apk

      - name: Publish release (direct download for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GeoInt Android build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: GeoInt-${{ github.run_number }}.apk
          body: |
            Install: download the APK on your phone, open it, allow "install unknown apps" for your browser.
            Commit: ${{ github.sha }}
